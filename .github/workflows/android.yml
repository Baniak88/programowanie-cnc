name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the offline page and the APK
        run: |
          ./build.sh
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cd android
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../warsztat-gcode.apk
      - uses: actions/upload-artifact@v4
        with:
          name: warsztat-gcode-apk
          path: warsztat-gcode.apk
      - name: Publish the APK as release "apk-latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest warsztat-gcode.apk \
            --title "Warsztat G-code – aplikacja Android" \
            --notes "Kurs CNC, symulator i generator CAM jako aplikacja Android. Działa bez internetu. Pobierz warsztat-gcode.apk na telefon i zainstaluj (zezwól na instalację z nieznanych źródeł). Wersja ${{ github.run_number }}." \
            --latest
